name: GitHub Pages'e yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Statik siteyi olustur
        run: npm run build:github
        env:
          NEXT_PUBLIC_BASE_PATH: /cantalyalojistik
          NEXT_PUBLIC_SITE_URL: https://4vksvg4q9x-afk.github.io/cantalyalojistik

      - name: Pages'i hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
